server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/tradetrail;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
tradetrail:
  logistics:
    secret: ${TRADETRAIL_LOGISTICS_SECRET:local-demo-secret-change-me}
