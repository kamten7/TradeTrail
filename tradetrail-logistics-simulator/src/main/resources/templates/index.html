<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TradeTrail 物流模拟端</title>
    <style>
        :root { --primary:#ff6b35; --text:#2d3436; --muted:#636e72; --border:#e9ecef; --bg:#f7f8fa; --card:#fff; }
        body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 system-ui,sans-serif; }
        header { background:var(--card); border-bottom:1px solid var(--border); padding:16px 24px; }
        main { max-width:1000px; margin:32px auto; padding:0 16px; }
        h1 { margin:0; font-size:24px; } h2 { margin:0 0 16px; font-size:20px; }
        .card { background:var(--card); border-radius:8px; padding:24px; margin-bottom:24px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
        .fields { display:grid; grid-template-columns:2fr 1fr 2fr auto; gap:12px; align-items:end; }
        label { display:block; color:var(--muted); font-size:14px; }
        input,select { display:block; box-sizing:border-box; width:100%; margin-top:4px; padding:8px; min-height:44px; border:1px solid var(--border); border-radius:6px; font:inherit; }
        button { min-height:44px; padding:8px 16px; border:0; border-radius:6px; background:var(--primary); color:#fff; font:inherit; cursor:pointer; }
        table { width:100%; border-collapse:collapse; } th,td { padding:12px; border-bottom:1px solid var(--border); text-align:left; }
        .muted { color:var(--muted); } .error { color:#f53f3f; font-size:14px; max-width:260px; word-break:break-word; }
        @media (max-width:700px) { .fields { grid-template-columns:1fr; } table { display:block; overflow-x:auto; } }
    </style>
</head>
<body>
<header><h1>TradeTrail · 物流模拟端</h1></header>
<main>
    <section class="card">
        <h2>录入物流轨迹</h2>
        <form method="post" action="/events" class="fields">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>商城运单号<input name="trackingNo" required placeholder="MOCK-..."></label>
            <label>节点<select name="status"><option>PICKED_UP</option><option>IN_TRANSIT</option><option>OUT_FOR_DELIVERY</option><option>DELIVERED</option><option>EXCEPTION</option></select></label>
            <label>地点<input name="location" required placeholder="例如：香港分拨中心"></label>
            <button type="submit">保存并推送</button>
        </form>
    </section>
    <section class="card">
        <h2>推送记录</h2>
        <p class="muted" th:if="${#lists.isEmpty(events)}">暂无事件。录入后可在这里查看推送结果。</p>
        <table th:unless="${#lists.isEmpty(events)}">
            <thead><tr><th>运单号</th><th>节点</th><th>地点</th><th>投递</th><th>操作</th></tr></thead>
            <tbody><tr th:each="event : ${events}">
                <td th:text="${event.trackingNo}"></td><td th:text="${event.status}"></td><td th:text="${event.location}"></td>
                <td><span th:text="${event.deliveryState}"></span><div class="error" th:text="${event.lastError}"></div></td>
                <td><form th:if="${event.deliveryState != 'SUCCESS'}" th:action="@{'/events/' + ${event.eventId} + '/retry'}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">重试</button></form></td>
            </tr></tbody>
        </table>
    </section>
</main>
</body>
</html>
